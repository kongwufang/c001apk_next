name: Desktop CI

# 桌面端（Windows）实验性构建线。
#
# 为什么单独一个 workflow：
#   * 现有 ci.yml 只在 main/debug/update 上跑，且用 ubuntu-latest 出 Android APK；
#   * 桌面端是独立 Gradle 构建（desktop/settings.gradle.kts），与 Android 工程隔离，
#     根 settings.gradle.kts 未做任何改动，所以 Android CI 完全不受影响。
#
# 触发：推 debug2 分支，或手动 workflow_dispatch。
on:
  workflow_dispatch:
    inputs:
      package:
        description: '是否打包可执行产物（便携 zip / MSI）'
        type: boolean
        default: true
  push:
    branches: [ debug2 ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v3

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Show versions
        working-directory: desktop
        run: |
          java -version
          .\gradlew.bat --version

      - name: Compile core
        working-directory: desktop
        run: .\gradlew.bat :core:compileKotlin --stacktrace

      # 黄金向量单测：用 12 个真机抓包 token 校验 v3 签名实现（离线，不访问网络）
      - name: Run core tests
        working-directory: desktop
        run: .\gradlew.bat :core:test --stacktrace

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-core-test-report
          path: desktop/core/build/reports/tests/**
          if-no-files-found: ignore

      - name: Compile desktop app
        working-directory: desktop
        run: .\gradlew.bat :app:compileKotlin --stacktrace

      # 便携版：jpackage app-image（内嵌精简 JRE，解压即用）
      - name: Package portable image
        if: github.event_name != 'push' || github.event.inputs.package != 'false'
        working-directory: desktop
        run: .\gradlew.bat :app:packageDistributionForCurrentOS --stacktrace

      - name: Upload portable image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-desktop-portable-windows
          path: desktop/app/build/compose/binaries/main/app/**
          if-no-files-found: ignore

      # MSI 安装包（windows-latest 预装 WiX）。失败不阻断，便于先跑通便携版
      - name: Package MSI
        continue-on-error: true
        working-directory: desktop
        run: .\gradlew.bat :app:packageMsi --stacktrace

      - name: Upload MSI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-desktop-msi
          path: desktop/app/build/compose/binaries/main/msi/**
          if-no-files-found: ignore
