name: Build

# 桌面端主线已切到 Flutter（原 Compose Desktop 方案见 c001apk_next 的 debug2 分支）。
# 这个 workflow 负责出 Windows 桌面版；顺带出 Android 版 —— 跨平台正是切过来的主要收益。
on:
  push:
    branches:
      - flutter
  workflow_dispatch:

# ★ 并发组：**同一分支只保留最新一次运行**，新推入时取消正在跑的那次。
#
# 为什么需要：
#   Windows + Android 双构建 + `flutter test` 一次约 10 分钟，而「一次一项走 CI」
#   时提交频率远高于此 —— 实测排到过 **5 个 in_progress**（同一 workflow 串行，
#   一个跑完才起下一个），日志要等 50 分钟，完全跟不上开发节奏。
#
# 取消旧的**不会漏验证**：每个提交都基于上一个提交，
# 只要**最新一次绿**，它之前的所有提交就都被覆盖到了；
# 反过来说，中间某次红的也一定会在最新一次的日志里体现出来。
#
# 需要逐个提交都留档时，用 `workflow_dispatch` 手动跑，或临时去掉这一段。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Windows 桌面版（主线目标）──
  windows:
    name: Windows x64
    # ★ 必须用 windows-2022，不能用 windows-latest。
    #
    # windows-latest 现在是 VS 18（MSVC 14.51），它**移除了 /await 编译选项**，
    # 而 `flutter_inappwebview_windows` 用的是旧式 C++/WinRT 协程
    # （`<experimental/coroutine>`），会报：
    #   error C2338: static assertion failed: 'error STL1011: The /await compiler option...'
    # VS 2022（MSVC 14.4x）仍支持 /await。
    # 这是插件滞后于工具链，不是我们代码的问题 —— 实测确认换运行器即可。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      # ★ 去掉 `continue-on-error: true`。
      #
      # 原来设了它 ⇒ `flutter analyze` 就算报 **error**（编译错误）也只算 warning，
      # 这个 step 永远显示 completed success ✗
      #
      # 实测后果：`2f3cabff` 的 Analyze 明明报了
      #   error - Undefined name 'onStickTop' - lib/components/cards/feed_card.dart:555:29
      # 却仍显示成功，只能等 10 分钟后的 `Build` 才发现 —— 白白浪费一轮。
      #
      # `--no-fatal-infos --no-fatal-warnings` 已经保证 **info / warning 不致命**，
      # 而 **error 本来就该致命**。去掉开关后 analyze 变成一个 ~2 分钟的快速编译门禁。
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ★ 单元测试：其中 test/token_v3_test.dart 用 golden 向量逐字节校验
      #   X-App-Token v3 的实现。服务端对该字段严格校验（伪造/版本不一致
      #   会直接 403），错一个字节整个登录态就废，所以必须由 CI 钉住。
      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-windows-x64
          path: build/windows/x64/runner/Release/
          compression-level: 9

  # ── Android 版（跨平台收益；APK 用于和真机横屏对照）──
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          compression-level: 9
