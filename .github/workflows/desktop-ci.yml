name: Desktop CI

# 桌面端（Windows）实验性构建线。
#
# 为什么单独一个 workflow：
#   * 现有 ci.yml 只在 main/debug/update 上跑，且用 ubuntu-latest 出 Android APK；
#   * 桌面端是独立 Gradle 构建（desktop/settings.gradle.kts），与 Android 工程隔离，
#     根 settings.gradle.kts 未做任何改动，所以 Android CI 完全不受影响。
#
# 签名 / 完整性自校验所需的 Secrets（照 Android 端 SIGN_KEYSTORE_BASE64 那套做法）：
#   DESKTOP_SIGN_KEY_BASE64    base64(ed25519_private.pem)   签「完整性清单」
#   DESKTOP_CODESIGN_PFX_B64   base64(codesign.pfx)          签安装包 exe
#   DESKTOP_CODESIGN_PFX_PWD   codesign.pfx 的密码
#
#   生成方式：python desktop/tools/make_desktop_keys.py
#   未配置时构建仍成功，但程序会跳过完整性校验、安装包不签名。
#
# ⚠️ 注意：step 的 `if:` 里**不能**引用 secrets 上下文（GitHub 限制），
#    所以这里统一用 `env:` 把 secret 传进步骤，在 shell 内判断。
#
# 触发：推 debug2 分支，或手动 workflow_dispatch。
on:
  workflow_dispatch:
  push:
    branches: [ debug2 ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

env:
  APP_IMAGE_DIR: desktop/app/build/compose/binaries/main/app/c001apk-desktop
  PUBKEY_KT: desktop/core/src/main/kotlin/com/example/c001apk/desktop/core/security/IntegrityPublicKey.kt

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v3

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Show versions
        working-directory: desktop
        run: |
          java -version
          .\gradlew.bat --version

      # ─────────────── 注入发行公钥（必须在打包之前，公钥要编译进程序） ───────────────
      - name: Embed integrity public key
        shell: pwsh
        env:
          SIGN_KEY_B64: ${{ secrets.DESKTOP_SIGN_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_KEY_B64)) {
            Write-Host "::warning::未配置 DESKTOP_SIGN_KEY_BASE64，跳过公钥注入（程序将跳过完整性校验）"
            exit 0
          }
          $env:PYTHONIOENCODING = 'utf-8'
          python desktop/tools/embed_public_key.py --key-b64 $env:SIGN_KEY_B64 --out-kt "${{ env.PUBKEY_KT }}"

      # ─────────────── 编译与单测 ───────────────
      - name: Compile core
        working-directory: desktop
        run: .\gradlew.bat :core:compileKotlin --stacktrace

      # 离线测试：v3 签名黄金向量（12 个真机向量）+ 完整性校验逻辑
      - name: Run core tests
        working-directory: desktop
        run: .\gradlew.bat :core:test --stacktrace

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-core-test-report
          path: desktop/core/build/reports/tests/**
          if-no-files-found: ignore

      - name: Compile desktop app
        working-directory: desktop
        run: .\gradlew.bat :app:compileKotlin --stacktrace

      # ─────────────── 打包 app-image ───────────────
      - name: Package app image
        working-directory: desktop
        run: .\gradlew.bat :app:packageAppImage --stacktrace

      # jpackage 的真实错误只写在 log 文件里，失败时务必打出来
      - name: Dump jpackage logs (on failure)
        if: failure()
        shell: pwsh
        working-directory: desktop
        run: |
          $root = "app\build\compose\logs"
          if (Test-Path $root) {
            Get-ChildItem $root -Recurse -File | ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName -Raw
            }
          }
          $tmp = "app\build\compose\tmp"
          if (Test-Path $tmp) {
            Get-ChildItem $tmp -File | ForEach-Object {
              Write-Host "===== args: $($_.Name) ====="
              Get-Content $_.FullName -Raw
            }
          }

      # ─────────────── 生成并签名完整性清单（放进应用镜像） ───────────────
      - name: Generate integrity manifest
        shell: pwsh
        env:
          SIGN_KEY_B64: ${{ secrets.DESKTOP_SIGN_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_KEY_B64)) {
            Write-Host "::warning::未配置签名密钥，跳过清单生成（程序将跳过完整性校验）"
            exit 0
          }
          $env:PYTHONIOENCODING = 'utf-8'
          $keyPem = Join-Path $env:RUNNER_TEMP "ed25519_private.pem"
          [IO.File]::WriteAllBytes($keyPem, [Convert]::FromBase64String(($env:SIGN_KEY_B64 -replace '\s','')))
          python desktop/tools/make_integrity.py `
            --app-dir "${{ env.APP_IMAGE_DIR }}" `
            --key $keyPem `
            --out-kt "${{ env.PUBKEY_KT }}"

      - name: Verify manifest before upload
        shell: pwsh
        env:
          SIGN_KEY_B64: ${{ secrets.DESKTOP_SIGN_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_KEY_B64)) {
            Write-Host "未配置签名密钥，跳过清单检查"
            exit 0
          }
          $mf = Join-Path "${{ env.APP_IMAGE_DIR }}" "integrity.sig"
          if (-not (Test-Path $mf)) { throw "清单未生成：$mf" }
          Write-Host ("清单大小: {0:N1} KB" -f ((Get-Item $mf).Length / 1KB))
          $listed = (Select-String -Path $mf -Pattern 'integrity\.sig' -AllMatches).Matches.Count
          if ($listed -ne 0) { throw "清单不应把自己列入 entries" }
          Write-Host "清单内容检查通过"

      - name: Upload app image (portable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-desktop-portable-windows
          path: desktop/app/build/compose/binaries/main/app/**
          if-no-files-found: ignore

      # ─────────────── 单文件 exe 安装器 ───────────────
      - name: Package EXE installer
        id: pkg_exe
        continue-on-error: true
        working-directory: desktop
        run: .\gradlew.bat :app:packageExe --stacktrace

      - name: Dump jpackage logs (exe, on failure)
        if: steps.pkg_exe.outcome == 'failure'
        shell: pwsh
        working-directory: desktop
        run: |
          Get-ChildItem "app\build\compose\logs" -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName -Raw
            }

      # 用发行证书给安装包签名（自签；不消除 SmartScreen，但能显示我们自己的发布者）
      - name: Sign EXE installer
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.DESKTOP_CODESIGN_PFX_B64 }}
          CODESIGN_PFX_PWD: ${{ secrets.DESKTOP_CODESIGN_PFX_PWD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_B64)) {
            Write-Host "::warning::未配置 DESKTOP_CODESIGN_PFX_B64，跳过安装包签名"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:CODESIGN_PFX_B64 -replace '\s','')))

          $exe = Get-ChildItem "desktop/app/build/compose/binaries/main/exe" -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "::warning::未找到 exe，跳过签名"; exit 0 }
          Write-Host "待签文件：$($exe.FullName)"

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
          if (-not $signtool) { Write-Host "::warning::未找到 signtool，跳过签名"; exit 0 }
          Write-Host "signtool：$($signtool.FullName)"

          & $signtool.FullName sign /f $pfx /p $env:CODESIGN_PFX_PWD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::signtool 退出码 $LASTEXITCODE（时间戳服务不可达时属正常）" }
          & $signtool.FullName verify /pa /v $exe.FullName

      - name: Upload EXE installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-desktop-exe-installer
          path: desktop/app/build/compose/binaries/main/exe/**
          if-no-files-found: ignore
