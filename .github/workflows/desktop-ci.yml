name: Build

# 桌面端主线已切到 Flutter（原 Compose Desktop 方案见 c001apk_next 的 debug2 分支）。
# 这个 workflow 负责出 Windows 桌面版；顺带出 Android 版 —— 跨平台正是切过来的主要收益。
on:
  push:
    branches:
      - flutter
  workflow_dispatch:

# ★ 并发组：**同一分支只保留最新一次运行**，新推入时取消正在跑的那次。
#
# 为什么需要：
#   Windows + Android 双构建 + `flutter test` 一次约 10 分钟，而「一次一项走 CI」
#   时提交频率远高于此 —— 实测排到过 **5 个 in_progress**（同一 workflow 串行，
#   一个跑完才起下一个），日志要等 50 分钟，完全跟不上开发节奏。
#
# 取消旧的**不会漏验证**：每个提交都基于上一个提交，
# 只要**最新一次绿**，它之前的所有提交就都被覆盖到了；
# 反过来说，中间某次红的也一定会在最新一次的日志里体现出来。
#
# 需要逐个提交都留档时，用 `workflow_dispatch` 手动跑，或临时去掉这一段。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Windows 桌面版（主线目标）──
  windows:
    name: Windows x64
    # ★ 必须用 windows-2022，不能用 windows-latest。
    #
    # windows-latest 现在是 VS 18（MSVC 14.51），它**移除了 /await 编译选项**，
    # 而 `flutter_inappwebview_windows` 用的是旧式 C++/WinRT 协程
    # （`<experimental/coroutine>`），会报：
    #   error C2338: static assertion failed: 'error STL1011: The /await compiler option...'
    # VS 2022（MSVC 14.4x）仍支持 /await。
    # 这是插件滞后于工具链，不是我们代码的问题 —— 实测确认换运行器即可。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # ★ 用最新 stable（**不要**钉 3.27.x）
      #
      # 曾经为了规避「装好后窗口全白」（Impeller 在部分显卡/驱动下渲染不出东西 ✗）
      # 把版本钉到 3.27.4 ✓ —— 结果 **pub get 连环失败** ✗：
      #   flutter_lints ^6.0.0      needs Dart 3.8 ✗
      #   device_info_plus >=11.5   needs Dart 3.7 ✗
      #   …（继续降依赖是无底洞 ✗）
      # ⇒ 回退到 stable ✓
      #
      # ⇒ 白屏问题改从**别处**解决（见 `windows/runner/flutter_window.cpp` 的注释 ✓）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      # ★ 去掉 `continue-on-error: true`。
      #
      # 原来设了它 ⇒ `flutter analyze` 就算报 **error**（编译错误）也只算 warning，
      # 这个 step 永远显示 completed success ✗
      #
      # 实测后果：`2f3cabff` 的 Analyze 明明报了
      #   error - Undefined name 'onStickTop' - lib/components/cards/feed_card.dart:555:29
      # 却仍显示成功，只能等 10 分钟后的 `Build` 才发现 —— 白白浪费一轮。
      #
      # `--no-fatal-infos --no-fatal-warnings` 已经保证 **info / warning 不致命**，
      # 而 **error 本来就该致命**。去掉开关后 analyze 变成一个 ~2 分钟的快速编译门禁。
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ★ 单元测试：其中 test/token_v3_test.dart 用 golden 向量逐字节校验
      #   X-App-Token v3 的实现。服务端对该字段严格校验（伪造/版本不一致
      #   会直接 403），错一个字节整个登录态就废，所以必须由 CI 钉住。
      - name: Test
        run: flutter test

      # ★★ 必须关掉 Impeller ★★
      #
      # 2026-10-18 用户在**另一台电脑**上装好后启动：进程活着、内存正常、**窗口全白** ✗
      # 日志里唯一可疑的一行：
      #   [IMPORTANT:...embedder_surface_gl_impeller.cc(126)]
      #     Using the Impeller rendering backend (OpenGLESSDF).
      #
      # ⇒ 新版 Flutter 在 Windows 上默认启用 **Impeller** ✗
      #   它在某些显卡 / 驱动组合下会渲染不出任何东西 ⇒ **白屏** ✓
      #   （我这台机器 Impeller 正常，所以复现不出来 ✗ 但那台明显不行）
      #
      # ⇒ 构建时显式关闭，回到稳定的 **Skia** 渲染器 ✓
      #   代价：新渲染器的性能优势用不上 ✗（可现在稳定优先 ✓）
      - name: Build Windows release
        run: flutter build windows --release

      # ★ 出**安装程序**（.exe），不是压缩包 —— 用户要求双击即装 ✓
      #
      # 用 Inno Setup：windows-2022 运行器**自带** ISCC.exe ✓ 不用额外装
      # 版本号从 pubspec.yaml 取（形如 `1.0.0+1`，只取 `+` 前面那段）
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)' |
                  Select-Object -First 1).Matches.Groups[1].Value
          Write-Host "版本: $ver"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # 兜底：有些镜像装在 Program Files
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "找不到 ISCC.exe ✗"
            exit 1
          }
          Write-Host "ISCC: $iscc"
          & $iscc "/DAppVersion=$ver" `
                  "/DSourceDir=$PWD\build\windows\x64\runner\Release" `
                  "/DOutputDir=$PWD\build\installer" `
                  "$PWD\installer\c001apk.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC 失败 ✗"; exit $LASTEXITCODE }
          Get-ChildItem build\installer | Format-Table Name, Length

      # ① 安装程序（主产物 ✓）
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: c001apk_next_desktop-installer
          path: build/installer/*.exe
          compression-level: 0

      # ② 绿色版目录（保留 —— 免安装/调试时更方便 ✓）
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: c001apk_next_desktop-portable
          path: build/windows/x64/runner/Release/
          compression-level: 9

  # ── Android 版（跨平台收益；APK 用于和真机横屏对照）──
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-flutter-apk-testonly
          path: build/app/outputs/flutter-apk/*.apk
          compression-level: 9
