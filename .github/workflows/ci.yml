name: CI

on:
  workflow_dispatch:
  # ★ 2026-10-28 发版锁（用户要求）：
  #   main 分支**不再**直接触发本工作流 ✗
  #   而是由 release.yml 触发 —— 它只监听「main + 改动 *.vision」
  #   ⇒ 推 main 但没改 *.vision ⇒ **CI 根本不会启动** ✓（不是跑起来再不发布 ✗）
  #   这样即使误推十几个文件到 main，也绝不会发新版 ✓
  workflow_call:
  push:
    # debug = 测试线：版本号对齐 main（= 线上最高号，不涨号），产物进 debug-latest（prerelease）
    # update = 只放升级配置 json，不构建产物（见 Publish 步骤的排除条件）
    # main 的发布由 release.yml 负责 ✓
    branches: [ debug, update ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.github/**'
      - '.idea/**'
      - '!.github/workflows/**'

# 把 APK 发布到 GitHub Release 需要写权限（默认只读会 403）；
# 正式版构建完还要把涨过的版本号写回 main，同样用这个权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v3

      # ⚠️ 不要再用 actions/setup-java 去**下载** JDK ✗
      # 实测这一步每次要 **681 秒（11 分钟）**，比整个编译还久 ✗
      # （distribution: adopt 更是早废弃的 AdoptOpenJDK，走的是慢镜像）
      # ubuntu-latest 镜像本来就预装 Temurin 17，环境变量 JAVA_HOME_17_X64 ✓ 直接用
      - name: Detect preinstalled JDK 17
        id: jdk
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ] && [ -x "$JAVA_HOME_17_X64/bin/java" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
            echo "用预装 JDK: $JAVA_HOME_17_X64"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "镜像里没有预装 JDK 17，走兜底下载"
          fi

      # 兜底：万一以后镜像不再预装，才去下（正常不会走到 ✓）
      # 注意分布要写 temurin —— adopt 是废弃的 AdoptOpenJDK ✗
      - name: set up JDK 17 (fallback)
        if: steps.jdk.outputs.found != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show java version
        run: java -version

      - name: Write key
        # 所有分支都用发行密钥签名，测试包可直接 adb install -r 覆盖安装
        if: github.event_name != 'pull_request'
        run: |
          if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
            # 从网页粘贴的 base64 常夹带换行/行尾空格，先清洗再解码，否则 base64 -d 会直接报错
            echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > key.jks
            echo KEYSTORE_PATH='${{ github.workspace }}/key.jks' >> local.properties
            echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' >> local.properties
            echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}' >> local.properties
            echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          else
            echo "::waning::未配置 SIGN_KEYSTORE_BASE64，release 将退回 debug 签名（仅供测试，不可作为正式版分发）"
          fi

      # 注意：不要钉死补丁号（如 v4.0.2），GitHub 会把废弃的旧版本直接判失败
      # ★ 用 setup-gradle 一并管 **依赖缓存 + 构建缓存** ✓
      # 原来手写的 actions/cache 明确排除了 `build-cache-*` ✗
      # 而 gradle.properties 也没开 org.gradle.caching ✗
      # ⇒ 编译产物从来没被复用，每次 `Build release` 都要从零跑 R8（实测 357 秒）✗
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 构建缓存：把 task 输出也存下来 ✓（默认只存依赖）
          cache-read-only: false
          # 缓存里塞太多历史条目会变慢，限制一下
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 渠道只影响 versionName 后缀：c001apk_next-V1.0.2-release / -debug
      - name: Resolve channel
        id: channel
        run: |
          case "${GITHUB_REF_NAME}" in
            main) C=release ;;
            *)    C=debug ;;
          esac
          echo "channel=$C" >> $GITHUB_OUTPUT
          echo "本次构建渠道：$C"

      # 版本号真源是 main 的 version.properties：main 每次发布都把号 +1 后写回，所以它
      # 永远等于「线上已发布的最高号」。这里把要用的号解出来直接写进工作区的
      # version.properties —— 两个变体（assembleRelease 与 assembleDebug）都读这个文件；
      # 以前只给 assembleRelease 传 -Poverride*，debug 包还留着本分支的旧号（10002 <
      # 线上 10003），装不上线上正式版。
      #   main  → 基线 +1（本次要发的正式版），构建完由 Commit bumped version 写回基线；
      #   其它  → 直接用 main 的基线，不涨号、不写回，测试包与线上正式版同号可来回覆盖。
      # ══════════════════════════════════════════════════════════════════
      # 发版锁（2026-10-28 用户要求）
      #
      #   「给 main 分支增加一个安全锁，定义一个 .vision 结尾的文件，
      #     只有这个文件被更新并推送时，主线才会开动 ci 升级」
      #
      # 规则：
      #   main   ⇒ 本次推送**必须改动过** `release.vision` 才发版 ✓
      #            没改 ⇒ 照常编译（验证能过）✓ 但**不涨版本号、不发布、不打 tag** ✗
      #   debug  ⇒ 不受影响 ✓（测试线本来就不发版）
      #   update ⇒ 不受影响 ✓（只发 json）
      #
      # 放行的三种情况：
      #   1. 本次推送 diff 里有 `*.vision` ✓
      #   2. 首次推送 / force push（before 是全 0）⇒ 没有可比的基线，放行 ✓
      #   3. 手动触发 workflow_dispatch ⇒ 显式意图，放行 ✓
      #
      # 注意：`paths-ignore` 里**不要**加 `*.vision` ✗ 否则只改它反而触发不了 ✓
      # ══════════════════════════════════════════════════════════════════
      - name: Release lock (.vision gate)
        id: lock
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"

          if [ "$BRANCH" != "main" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "::notice::分支 $BRANCH 不受发版锁影响 ⇒ 放行"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "::notice::手动触发 ⇒ 放行"
            exit 0
          fi

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "::notice::首次推送 / force push（无基线可比较）⇒ 放行"
            exit 0
          fi

          # 拿到 before 这个提交（fetch-depth: 0 一般有；没有就按 SHA 浅取）
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null || true
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || true)
          echo "本次推送改动的文件（$(echo "$CHANGED" | grep -c . || true) 个）："
          echo "$CHANGED" | sed 's/^/  /'

          if echo "$CHANGED" | grep -qE '\.vision$'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "::notice::✅ 本次推送改动了 *.vision ⇒ 发版"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::⛔ 本次推送没有改动 *.vision ⇒ **不发版**（照常编译，但不涨号/不发布/不打 tag）"
            echo "::notice::要发版请改一行 release.vision 再一起推"
          fi

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          # 一律 tr -d '\r'：version.properties 在 Windows 侧检出时是 CRLF，
          # 不剥掉行尾的 \r，$(( )) 会直接报 "integer expression expected"
          LOCAL_NAME=$(grep -m1 '^VERSION_NAME=' version.properties | cut -d= -f2- | tr -d '\r')
          LOCAL_CODE=$(grep -m1 '^VERSION_CODE=' version.properties | cut -d= -f2- | tr -d '\r')

          # 同仓库 main 分支的号（checkout 用 fetch-depth: 0，一般已在本地 refs 里）
          if ! git show origin/main:version.properties > /tmp/main-version.properties 2>/dev/null; then
            git fetch origin main --depth=1
            git show origin/main:version.properties > /tmp/main-version.properties
          fi
          MAIN_NAME=$(grep -m1 '^VERSION_NAME=' /tmp/main-version.properties | cut -d= -f2- | tr -d '\r')
          MAIN_CODE=$(grep -m1 '^VERSION_CODE=' /tmp/main-version.properties | cut -d= -f2- | tr -d '\r')

          # 两个来源取号大的那份（正常是 main 更大；本分支被手工调高过就尊重本地）
          if [ "${MAIN_CODE:-0}" -gt "${LOCAL_CODE:-0}" ]; then
            BASE_NAME=$MAIN_NAME; BASE_CODE=$MAIN_CODE
          else
            BASE_NAME=$LOCAL_NAME; BASE_CODE=$LOCAL_CODE
          fi
          echo "版本号来源：main=${MAIN_NAME}(${MAIN_CODE}) 本分支=${LOCAL_NAME}(${LOCAL_CODE}) → 基线 ${BASE_NAME}(${BASE_CODE})"

          # ★ 2026-10-28 发版锁：main 分支只有改过 *.vision 才涨号 ✓
          if [ "${GITHUB_REF_NAME}" = "main" ] && [ "${{ steps.lock.outputs.go }}" = "true" ]; then
            BASE=${BASE_NAME#V}
            NAME="V${BASE%.*}.$(( ${BASE##*.} + 1 ))"
            CODE=$(( BASE_CODE + 1 ))
            echo "::notice::正式版：${BASE_NAME}（${BASE_CODE}）→ 本次发布 ${NAME}（${CODE}）"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            # 发版锁没开 ⇒ 沿用线上最高号 ✓ 不涨、不写回、不发布 ✗
            NAME=$BASE_NAME
            CODE=$BASE_CODE
            echo "::notice::⛔ 发版锁未开 ⇒ 只编译验证，沿用 ${NAME}（${CODE}），不涨号、不发布"
          else
            NAME=$BASE_NAME
            CODE=$BASE_CODE
            echo "::notice::测试线：沿用线上最高号 ${NAME}（${CODE}），不涨号、不写回"
          fi

          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${NAME}/" version.properties
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${CODE}/" version.properties
          grep -E '^VERSION_(NAME|CODE)=' version.properties
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "code=${CODE}" >> $GITHUB_OUTPUT

      - name: Build release
        id: buildRelease
        run: |
          set -o pipefail
          # 本次要用的版本号已由 Resolve version 写进 version.properties，
          # Gradle 直接读文件即可（assembleDebug 也是这样拿到同一个号）
          ./gradlew :app:assembleRelease -Pchannel=${{ steps.channel.outputs.channel }} --stacktrace 2>&1 | tee gradle-release.log
          echo "releaseName=$(ls app/build/outputs/apk/release/*.apk | awk -F '(/|\\.apk)' '{print $6}')" >> $GITHUB_OUTPUT

      - name: Upload release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # 加 release- 前缀：debug 分支上 release 包的 versionName 也是 -debug，
          # 与 debug 包同名，不加前缀会撞名 409
          name: release-${{ steps.buildRelease.outputs.releaseName }}
          path: "app/build/outputs/apk/release/*.apk"

      # 每次都把 release 的签名证书指纹打到日志，防止某次悄悄退回 debug 签名
      - name: Verify release signature
        if: success() && github.event_name != 'pull_request'
        run: |
          set -o pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
            echo "::notice::$(basename "$APK") 签名证书 SHA-256 = $(grep -m1 'certificate SHA-256 digest' /tmp/certs.txt | sed 's/.*digest: //')"
          else
            echo "::waning::未找到 apksigner，跳过签名校验"
          fi

      - name: Upload mappings
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mappings
          path: "app/build/outputs/mapping/release"

      - name: Build debug
        id: buildDebug
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee gradle-debug.log
          echo "debugName=$(ls app/build/outputs/apk/debug/*.apk | awk -F '(/|\\.apk)' '{print $6}')" >> $GITHUB_OUTPUT

      - name: Upload debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ steps.buildDebug.outputs.debugName }}
          path: "app/build/outputs/apk/debug/*.apk"

      # 每个分支把各自编译出来的发行版放到「自己固定位置」的 GitHub Release：
      #   main  → release-latest（正式版）
      #   debug → debug-latest（测试版，prerelease）
      # update 分支只放更新配置（json），不发布产物。
      - name: Publish to GitHub Releases
        # ★ 2026-10-28 发版锁：main 分支没改 *.vision 就不发布 ✗
        #   （debug 线不受影响 ✓ 它本来就只发 prerelease ✓）
        # ⚠️ 不能判 `github.event_name == 'push'` ✗
        #   因为 release.yml 是用 workflow_call 调的 ⇒ event_name 是 `workflow_call` ✗
        #   那样 main 的发版会被静默跳过 ✗（2026-10-28 差点踩）
        #   ⇒ 改成只判分支 + 发版锁 ✓
        if: |
          success() && github.ref_name != 'update'
          && (github.ref_name != 'main' || steps.lock.outputs.go == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            main) TAG=release-latest; TITLE="正式版（main 自动构建）"; PRE=() ;;
            *)    TAG=debug-latest;   TITLE="测试版（debug 自动构建）"; PRE=(--prerelease) ;;
          esac

          # 只发布正式签名的发行包。debug 构建出的包与它同名（都叫 xxx-debug(版本号).apk），
          # 而 GitHub 会把文件名里的 ( ) 规范化成 .，两个包放同一位置会撞名（422 already_exists），
          # 所以 debug 包继续在 Actions 的 artifact 里下载。
          FILES=()
          for f in app/build/outputs/apk/release/*.apk; do
            if [ -f "$f" ]; then FILES+=("$f"); fi
          done
          echo "本次发布产物：${FILES[*]}"

          # 本次用的号由 Resolve version 决定（main 是 +1 后的号，其它分支是 main 的基线），
          # 它已经写进 version.properties，正常直接取 outputs
          VERSION="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 '^VERSION_NAME=' version.properties | cut -d= -f2-)
            CODE=$(grep -m1 '^VERSION_CODE=' version.properties | cut -d= -f2-)
          fi
          NOTES=/tmp/release-notes.md
          {
            echo "自动构建：\`${GITHUB_REF_NAME}\` 分支 @ ${GITHUB_SHA:0:7}"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${VERSION}（versionCode ${CODE}） |"
            echo "| 渠道 | ${{ steps.channel.outputs.channel }} |"
            echo "| 提交 | ${GITHUB_SHA} |"
            echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } > "$NOTES"

          # ★ 2026-10-25 改：只生成本版本的改动，不再累积全量清单
          #
          # 用户反馈：「只写本版本的更新，不写前面的」
          #   旧做法把 `.github/release-notes.md`（越来越长的全量功能清单）
          #   每次追加 ✗ 结果页面长期停在「V1.0.5 · 本版更新」那种陈年内容 ✗
          #
          # 新做法：用【上一个版本 tag】到现在的 git log 自动生成
          #   1. 每个正式版发布后打一个 `V1.0.8` 这样的 tag（发版流程的一步 ✓）
          #   2. 这里取 `V*` 里最大的 tag 当区间起点 ✓
          #   3. 按 feat / fix / perf 分组 ✓ 只列本次 ✓
          #   4. `.github/release-notes.md` 变成**可选补充**（当版重点），
          #      不写就不显示 ✓ 写了也只在最后 ✓ 不再是主体 ✗
          PREV_TAG=$(git tag -l 'V[0-9]*' --sort=-v:refname | head -1 || true)
          echo
          echo "---"
          echo
          if [ -n "${PREV_TAG:-}" ]; then
            RANGE="${PREV_TAG}..HEAD"
            CNT=$(git rev-list --count "$RANGE" 2>/dev/null || echo 0)
            echo "## ${VERSION} · 本版更新"
            echo
            echo "> 相对 **${PREV_TAG}** 的改动（${CNT} 个提交）"
            echo
            FEATS=$(git log "$RANGE" --no-merges --pretty='%s' | grep -E '^feat' || true)
            if [ -n "$FEATS" ]; then
              echo "### 新增"
              echo
              echo "$FEATS" | sed -E 's/^feat(\([^)]*\))?[:：][[:space:]]*/- /'
              echo
            fi
            FIXES=$(git log "$RANGE" --no-merges --pretty='%s' | grep -E '^fix' || true)
            if [ -n "$FIXES" ]; then
              echo "### 修复"
              echo
              echo "$FIXES" | sed -E 's/^fix(\([^)]*\))?[:：][[:space:]]*/- /'
              echo
            fi
            PERFS=$(git log "$RANGE" --no-merges --pretty='%s' | grep -E '^perf' || true)
            if [ -n "$PERFS" ]; then
              echo "### 优化"
              echo
              echo "$PERFS" | sed -E 's/^perf(\([^)]*\))?[:：][[:space:]]*/- /'
              echo
            fi
            echo "<details><summary>全部提交（${CNT} 个）</summary>"
            echo
            git log "$RANGE" --no-merges --pretty='- %s（%h）'
            echo
            echo "</details>"
          else
            echo "> ⚠️ 没找到 \`V*\` 形式的版本 tag，只能列出最近 30 个提交"
            echo "> 发版流程见 \`发版流程.md\`：发布后要 \`git tag V1.0.x && git push next --tags\`"
            echo
            git log -30 --no-merges --pretty='- %s（%h）'
          fi
          echo
          # 可选：当版人工写的重点（维护者自己决定写不写 ✓ 不写就不显示 ✓）
          if [ -f .github/release-notes.md ]; then
            {
              echo "---"
              echo
              cat .github/release-notes.md
            } >> "$NOTES"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" "${PRE[@]}"
          else
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES" \
              --target "$GITHUB_REF_NAME" "${PRE[@]}"
          fi

          # 每个位置只留最新一份：上传前先清空上一次的产物（版本号变化后文件名也不同）
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r n; do
            if [ -n "$n" ]; then gh release delete-asset "$TAG" "$n" --yes; fi
          done

          # release 刚建出来时立刻上传会偶发 404（服务端还没就绪），失败就退避重试
          ok=0
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" "${FILES[@]}" --clobber; then ok=1; break; fi
            echo "::waning::发布 ${TAG} 上传失败（第 ${i} 次），5 秒后重试"
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::发布 ${TAG} 失败，产物未上传"
            exit 1
          fi

          # 把本次发行版的位置写进 run summary 和 annotation，方便直接拿链接。
          # asset 名由 GitHub 规范化（文件名里的 ( ) 会变成 .），所以链接以服务端返回的名字为准
          export BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo "## 发行版位置"
            echo
            echo "- ${TITLE}：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            gh release view "$TAG" --json assets --jq '.assets[] | "  - \(env.BASE)/\(.name)"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::${TITLE} → https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      # 正式版：把本次用掉的版本号提交到 main，作为下一次 +1 的基线。
      # 工作区里的 version.properties 在 Resolve version 已经改成新号了，这里只是把它提交掉。
      # GITHUB_TOKEN 的推送本身不会再触发 workflow，再加 [skip ci] 双保险。
      - name: Commit bumped version
        # 只有真的涨了号才写回 ✗（发版锁没开时号没变，不该 commit）
        if: success() && github.ref_name == 'main' && steps.lock.outputs.go == 'true'
        run: |
          set -euo pipefail
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${{ steps.ver.outputs.name }}/" version.properties
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${{ steps.ver.outputs.code }}/" version.properties
          git add version.properties
          if git diff --cached --quiet; then
            echo "版本号无变化，跳过提交"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(release): ${{ steps.ver.outputs.name }}（versionCode ${{ steps.ver.outputs.code }}）[skip ci]"
          git push origin HEAD:main
          echo "::notice::已把 ${{ steps.ver.outputs.name }}（${{ steps.ver.outputs.code }}）写回 main，下次发布在此基础上 +1"

      # 正式版自动打版本 tag（如 V1.0.5），指向本次发布用的提交。
      # 以前每次发版都要手工补一个 V1.0.x，容易忘、也容易指错提交；这里自动化。
      # 只打在 main 上：debug 与 main 同号（版本号是共用的），打 tag 会撞名。
      # 位置在 Commit bumped version 之后，保证 tag 指向的提交
      # 已经包含版本号写回，与历史上 V1.0.4 的指向方式一致。
      - name: Create version tag
        if: success() && github.ref_name == 'main' && steps.lock.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.name }}"
          if [ -z "$TAG" ]; then
            echo "::error::没有解析出版本名，拒绝打 tag"
            exit 1
          fi
          # 幂等：tag 或同名 Release 已存在就跳过（重跑 workflow / 回滚重发时不会报错）
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::tag ${TAG} 已存在，跳过"
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                tag -a "${TAG}" -m "c001apk_next ${TAG}（versionCode ${{ steps.ver.outputs.code }}）"
            git push origin "refs/tags/${TAG}"
            echo "::notice::已自动打 tag ${TAG} → ${GITHUB_SHA:0:7}"
          fi
          # 同时建一个同名 Release 作为该版本的固定归档入口。
          # 注意：Release 页面会挂 commit 的自动源码包，所以一定要带说明文字，
          # 否则那个页面是空的。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} 已存在，跳过创建"
          else
            gh release create "$TAG" --title "${TAG}" --target "$GITHUB_SHA" \
              --notes "版本归档：${TAG}（versionCode ${{ steps.ver.outputs.code }}）。
          正式版 APK 在 [release-latest](https://github.com/${GITHUB_REPOSITORY}/releases/tag/release-latest)；此处作为该版本的固定 tag / 归档入口。" \
              2>/dev/null || echo "::warning::Release ${TAG} 创建失败（可能被分支保护或权限限制），tag 已建好，不影响发布"
          fi

          # 把本次正式包也归档到这个版本 Release 上，与历史上手工建的 V1.0.3 / V1.0.4 形态一致。
          # ⚠️ 必须放在这里而不是 Publish 步骤里：Release 是本步骤刚创建的，
          #    放在 Publish 会让 gh release view 查不到、静默跳过（V1.0.5 首轮就这么空了一次）。
          # asset 名含版本号，与 release-latest 上的同名文件不冲突。
          FILES=()
          for f in app/build/outputs/apk/release/*.apk; do
            if [ -f "$f" ]; then FILES+=("$f"); fi
          done
          if [ ${#FILES[@]} -gt 0 ] && gh release view "$TAG" >/dev/null 2>&1; then
            if gh release upload "$TAG" "${FILES[@]}" --clobber; then
              echo "::notice::已把 ${FILES[*]} 归档到 Release ${TAG}"
            else
              echo "::warning::产物归档到 Release ${TAG} 失败（tag 已建好，不影响发布）"
            fi
          else
            echo "::warning::没找到 release APK 或 Release 不存在，跳过归档"
          fi

      # 失败时把 Gradle 日志尾部转成 annotation，
      # 这样在 Actions 页面和失败通知邮件里就能直接看到原因，不用再翻完整日志
      - name: Report Gradle failure
        # 只在 Gradle 构建本身失败时 tail 日志；上传/签名等步骤失败不再刷一堆假 error
        if: failure() && (steps.buildRelease.outcome == 'failure' || steps.buildDebug.outcome == 'failure')
        run: |
          echo "::error::REPORT-STEP | pwd=$(pwd) | logs=$(ls -1 gradle-*.log 2>/dev/null | tr '\n' ' ')"
          for f in gradle-release.log gradle-debug.log; do
            if [ -f "$f" ]; then
              echo "::error::logs found: $f ($(wc -c < "$f") bytes)"
              tail -120 "$f" | while IFS= read -r line; do echo "::error::$line"; done
              break
            fi
          done
