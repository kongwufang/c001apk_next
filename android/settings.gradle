pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP 8.10.0 → 8.11.1：Flutter 当前版本要求 AGP >= 8.11.1
    //   Error: Your project's Android Gradle Plugin version (8.10.0) is lower than
    //          Flutter's minimum supported version of Android Gradle Plugin version 8.11.1.
    // 与 Gradle 8.14.3（已升）+ Kotlin 2.1.20 兼容。
    id "com.android.application" version "8.11.1" apply false
    // Kotlin 2.1.20 → 2.2.20：Flutter 当前版本要求 Kotlin >= 2.2.20
    //   Error: Your project's Kotlin version (2.1.20) is lower than
    //          Flutter's minimum supported version of 2.2.20.
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
